<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySearchPage</title>
    <link rel="stylesheet" href="navigation.css">
</head>
<body class="flex1">
    <div class="fixed-header flex1">
        <div class="search-container">
            <input type="text" id="search-input" autocomplete="off">
            <span class="clear-input" title="清空输入">×</span>
        </div>

        <div class="button-wrapper">
            <div class="control-buttons">
                <button id="save-only">仅保存</button>
                <button id="all-sites">所有</button>
                <button id="common-sites">常用</button>
                <button id="foreign-sites">外网</button>
                <button id="edit-history">编辑历史</button>
                <button id="export-history">导出历史</button>
                <button id="import-history">导入历史</button>
                <button id="export-ua-rules">导出UA规则</button>
            </div>
            <div class="btn-group">
                <!-- 按钮将通过 JavaScript 从 IndexedDB 动态生成 -->
            </div>
        </div>

        <div class="history-header flex1">
            <div class="history-title">搜索历史</div>
            <button id="mobile-esc-btn" class="mobile-only button"> Esc </button>
            <input type="text" id="quick-search-input" autocomplete="off" spellcheck="false">
            <button id="sort-by-name" class="small">名称 ↑</button>
            <button id="sort-by-time" class="small">时间 ↓</button>
            <button id="sort-by-length" class="small">长度 ↑</button>
            <button id="sort-by-first-time" class="small">首次 ↓</button>
            <button id="sort-by-count" class="small">次数 ↓</button>
        </div>
    </div>

    <div class="scrollable-content">
        <div id="history-list" class="flex2"></div>
    </div>

    <div class="modal" id="error-modal">
        <div class="modal-content">
            <p>请输入搜索关键词！</p>
        </div>
    </div>

    <div class="edit-history-modal" id="edit-history-modal" style="display: none;">
        <input type="text" id="history-edit-input">
    </div>
    <script src="pinyin_dict_firstletter.js"></script>
    <script src="history-persistence.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
